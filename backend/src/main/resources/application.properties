# ===================================
# Server Configuration
# ===================================
server.port=8080
server.servlet.context-path=/

# ===================================
# MySQL Database Configuration
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sanju@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ===================================
# JPA / Hibernate Configuration
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=eCommerce_Super_Secret_Key_2024_Spring_Boot_JWT_Authentication_Module_32Chars_Min
app.jwt.expiration-ms=86400000
# 86400000 = 24 hours | 604800000 = 7 days (remember me)
app.jwt.remember-me-expiration-ms=604800000

# ===================================
# Spring Security
# ===================================
spring.security.user.name=admin
spring.security.user.password=admin

# ===================================
# Logging
# ===================================
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=INFO
